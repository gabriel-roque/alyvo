map $http_origin $studio_cors_origin {
    default "";
    "https://smith.langchain.com" $http_origin;
}

map $http_upgrade $studio_connection_upgrade {
    default upgrade;
    "" close;
}

map "$request_method:$studio_cors_origin" $studio_reject_preflight {
    default 0;
    "OPTIONS:" 1;
}

map $studio_cors_origin $studio_cors_true {
    default "";
    "https://smith.langchain.com" "true";
}

server {
    listen 2024;
    server_name localhost;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $studio_upstream studio:2025;

    location / {
        if ($studio_reject_preflight) {
            return 403;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://$studio_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $studio_connection_upgrade;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Private-Network;
        proxy_hide_header Vary;

        add_header Access-Control-Allow-Origin $studio_cors_origin always;
        add_header Access-Control-Allow-Credentials $studio_cors_true always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Private-Network $studio_cors_true always;
        add_header Access-Control-Max-Age "600" always;
        add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
    }
}
