[project]
name = "alyvo"
version = "0.1.0"
description = "Assistente administrativo multimodal para clínicas — dados sintéticos"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "celery[redis]>=5.4,<6",
  "redis>=5,<7",
  "neo4j>=5.20,<7",
  "boto3>=1.34,<2",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langchain-ollama>=0.2,<2",
  "langsmith>=0.3,<1",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "sentence-transformers>=3,<6",
  "pypdf>=5,<7",
  "Pillow>=11,<13",
  "cryptography>=43,<51",
  "alembic>=1.14,<2",
  "scalar-fastapi>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "mypy>=1.13,<2",
  "import-linter>=2.1,<3",
]
studio = ["langgraph-cli[inmem]>=0.4,<1"]
ocr = ["paddleocr>=2.8,<3", "paddlepaddle>=2.6,<3"]
eval = ["ragas>=0.4,<0.5", "openai>=1,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api", "apps/worker"]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests/integration"]
pythonpath = ["apps/api", "apps/worker"]
addopts = "-q --disable-warnings"

[tool.coverage.run]
source = ["apps/api/app", "apps/worker/worker"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 80

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Domain is framework independent"
type = "forbidden"
source_modules = [
  "app.modules.identity.domain",
  "app.modules.catalog.domain",
  "app.modules.scheduling.domain",
  "app.modules.knowledge.domain",
  "app.modules.conversations.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "langgraph", "langchain", "neo4j", "boto3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP017", "UP042"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict = true

[[tool.mypy.overrides]]
module = [
  "app.agent.*",
  "app.api.*",
  "app.infrastructure.*",
  "app.modules.*",
  "app.shared.*",
]
disallow_untyped_defs = true
disallow_any_generics = true

