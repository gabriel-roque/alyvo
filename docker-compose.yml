name: alyvo

x-app-environment: &app-environment
  APP_ENV: development
  APP_SECRET: ${APP_SECRET:-alyvo-local-development-only}
  DATABASE_URL: postgresql+psycopg://alyvo:alyvo@postgres:5432/alyvo
  LANGGRAPH_DATABASE_URL: postgresql://alyvo:alyvo@postgres:5432/alyvo?options=-csearch_path%3Dlanggraph
  REDIS_URL: redis://redis:6379/0
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-alyvo-demo}
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: alyvo
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-alyvo-demo}
  MINIO_BUCKET: alyvo-documents
  LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-openrouter}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-ollama}
  LLM_ROUTING_ENABLED: ${LLM_ROUTING_ENABLED:-false}
  LLM_RESPONSE_ENABLED: ${LLM_RESPONSE_ENABLED:-true}
  LLM_RESPONSE_MAX_TOKENS: ${LLM_RESPONSE_MAX_TOKENS:-260}
  ALLOW_EXTERNAL_PROVIDERS: ${ALLOW_EXTERNAL_PROVIDERS:-true}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-12}
  OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-1}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-alyvo}
  LANGCHAIN_TRACING_SAMPLING_RATE: ${LANGSMITH_SAMPLING_RATE:-1.0}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b-q4_K_M}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
  OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-3}
  OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  KNOWLEDGE_VECTOR_MIN_SCORE: ${KNOWLEDGE_VECTOR_MIN_SCORE:-0.76}
  KNOWLEDGE_INDEX_VERSION: ${KNOWLEDGE_INDEX_VERSION:-v2}
  CHUNK_PARSER_VERSION: ${CHUNK_PARSER_VERSION:-structural-v2}
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  OCR_PROVIDER: ${OCR_PROVIDER:-paddle}
  HF_HOME: /models/huggingface
  PADDLE_OCR_BASE_DIR: /models/paddleocr
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  neo4j:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alyvo
      POSTGRES_USER: alyvo
      POSTGRES_PASSWORD: alyvo
    ports:
      - "5432:5432"
    volumes:
      - postgres_single_clinic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alyvo -d alyvo"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_single_clinic_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-alyvo-demo}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_single_clinic_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: alyvo-minio
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: alyvo
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-alyvo-demo}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_single_clinic_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_QUEUE: 32
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-model:
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$OLLAMA_MODEL && ollama run $$OLLAMA_MODEL 'Responda apenas: OK'"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    environment: *app-environment
    command: ["python", "-m", "app.bootstrap.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      <<: *app-depends-on
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully
    volumes:
      - model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30

  studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: studio
    environment:
      APP_ENV: studio
      DATABASE_URL: sqlite:////tmp/alyvo-studio-guard.sqlite3
      LLM_PRIMARY_PROVIDER: ${STUDIO_LLM_PRIMARY_PROVIDER:-ollama}
      LLM_FALLBACK_PROVIDER: ollama
      ALLOW_EXTERNAL_PROVIDERS: ${ALLOW_EXTERNAL_PROVIDERS:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-12}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-1}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-alyvo-local-studio}
      LANGCHAIN_TRACING_SAMPLING_RATE: ${LANGSMITH_SAMPLING_RATE:-1.0}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b-q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-3}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OCR_PROVIDER: mock
    command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "2025", "--no-browser", "--no-reload"]
    expose:
      - "2025"
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2025/ok')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  studio-proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:2024:2024"
    volumes:
      - ./infra/studio-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      studio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2024/ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app-environment
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      <<: *app-depends-on
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    volumes:
      - model_cache:/models

  beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=INFO"]
    environment: *app-environment
    depends_on:
      worker:
        condition: service_started
    volumes:
      - model_cache:/models

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        API_INTERNAL_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 30

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  validate:
    build:
      context: .
      dockerfile: infra/validation.Dockerfile
    environment:
      API_URL: http://api:8000/api/v1
      WEB_URL: http://web:3000
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql+psycopg://alyvo:alyvo@postgres:5432/alyvo
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-alyvo-demo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      seed:
        condition: service_completed_successfully
      web:
        condition: service_healthy
      worker:
        condition: service_started
      beat:
        condition: service_started
    profiles: ["validation"]
    volumes:
      - ./reports:/workspace/reports

volumes:
  postgres_single_clinic_data:
  redis_single_clinic_data:
  neo4j_single_clinic_data:
  minio_single_clinic_data:
  ollama_data:
  model_cache:
