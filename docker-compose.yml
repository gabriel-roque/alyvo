name: alyvo

x-app-environment: &app-environment
  APP_ENV: development
  APP_SECRET: ${APP_SECRET:-alyvo-local-development-only}
  DATABASE_URL: postgresql+psycopg://alyvo_app:alyvo-app@postgres:5432/alyvo
  REDIS_URL: redis://redis:6379/0
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-alyvo-demo}
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: alyvo
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-alyvo-demo}
  MINIO_BUCKET: alyvo-documents
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-10}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
  OCR_PROVIDER: ${OCR_PROVIDER:-paddle}
  HF_HOME: /models/huggingface
  PADDLE_OCR_BASE_DIR: /models/paddleocr
  DEMO_OTP: ${DEMO_OTP:-123456}
  DEMO_TENANT: clinic-alyvo

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  postgres-init:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  neo4j:
    condition: service_healthy
  minio:
    condition: service_healthy
  mailpit:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alyvo
      POSTGRES_USER: alyvo
      POSTGRES_PASSWORD: alyvo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alyvo -d alyvo"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: alyvo
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "alyvo", "-d", "alyvo", "-f", "/infra/postgres-init.sql"]
    volumes:
      - ./infra/postgres-init.sql:/infra/postgres-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-alyvo-demo}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: alyvo-minio
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: alyvo
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-alyvo-demo}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-model:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$OLLAMA_MODEL"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-environment
      DATABASE_ADMIN_URL: postgresql+psycopg://alyvo:alyvo@postgres:5432/alyvo
    ports:
      - "8000:8000"
    depends_on:
      <<: *app-depends-on
      ollama-model:
        condition: service_completed_successfully
    volumes:
      - model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/deep')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app-environment
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      <<: *app-depends-on
      api:
        condition: service_healthy
    volumes:
      - model_cache:/models

  beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=INFO"]
    environment: *app-environment
    depends_on:
      worker:
        condition: service_started
    volumes:
      - model_cache:/models

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_DEMO_TENANT: clinic-alyvo
        API_INTERNAL_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_DEMO_TENANT: clinic-alyvo
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 30

  validate:
    build:
      context: .
      dockerfile: infra/validation.Dockerfile
    environment:
      API_URL: http://api:8000/api/v1
      WEB_URL: http://web:3000
      MAILPIT_URL: http://mailpit:8025
      DATABASE_URL: postgresql+psycopg://alyvo_app:alyvo-app@postgres:5432/alyvo
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-alyvo-demo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_started
      beat:
        condition: service_started
    profiles: ["validation"]
    volumes:
      - ./reports:/workspace/reports

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  minio_data:
  ollama_data:
  model_cache:
